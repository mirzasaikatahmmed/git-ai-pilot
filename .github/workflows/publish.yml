name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - 'apps/cli/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # main is a protected branch requiring PRs — the default GITHUB_TOKEN
          # (acting as github-actions[bot]) can't push past that. GH_PAT is a
          # personal access token from an account allowed to bypass the rule.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npx turbo build

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        run: |
          cd apps/cli
          npm version patch --no-git-tag-version
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # npm's own git commit/tag step only works when package.json sits at the git
      # root — apps/cli is a subdirectory of this monorepo, so npm version silently
      # leaves the bump as an uncommitted change instead of erroring. Commit it ourselves.
      - name: Commit Version Bump
        run: |
          git add apps/cli/package.json apps/cli/CHANGELOG.md
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"

      - name: Push Version Bump
        run: git push origin HEAD:main --follow-tags

      - name: Publish
        run: |
          cd apps/cli
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'CI failure: Publish Package workflow';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The **Publish Package** workflow failed on \`${context.ref}\` (commit ${context.sha.slice(0, 7)}).`,
              '',
              `**Run:** ${runUrl}`,
              `**Triggered by:** @${context.actor}`,
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
            });
            const existing = openIssues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci-failure'],
              });
            }
